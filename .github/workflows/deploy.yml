name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        uses: labmlai/hf-space-sync@v1
        with:
          github_repo_url: https://github.com/zadif/CV-Panorama
          huggingface_user_name: Zadif123
          space_name: panorama-api
          space_sdk: gradio
          hf_token: ${{ secrets.HF_WRITE }}